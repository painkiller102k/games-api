
openapi: 3.0.3

info:
  title: GamesAPI
  version: 1.0.0
  description: API for managing games with User and Admin roles.

servers:
  - url: http://localhost:8080

tags:
  - name: GamesAPI
    description: Game management endpoints

security:
  - basicAuth: []

paths:
  /games:
    get:
      tags:
        - GamesAPI
      summary: Get all games
      description: Available to User and Admin.
      responses:
        '200':
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - GamesAPI
      summary: Create a game
      description: Available to User and Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGame'
      responses:
        '201':
          description: Game created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Invalid or missing name or price
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Game with this name already exists

  /games/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1

    get:
      tags:
        - GamesAPI
      summary: Get a game by ID
      description: Available to User and Admin.
      responses:
        '200':
          description: Game found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Game not found

    put:
      tags:
        - GamesAPI
      summary: Update a game
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGame'
      responses:
        '200':
          description: Game updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          description: Invalid or missing name or price
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Game not found
        '409':
          description: Game with this name already exists

    delete:
      tags:
        - GamesAPI
      summary: Delete a game
      description: Admin only.
      responses:
        '204':
          description: Game deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Game not found

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Enter your username and password.

        User: user / user123
        Admin: admin / admin123

  schemas:
    Game:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Minecraft
        price:
          type: number
          example: 20

    NewGame:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: New Game
        price:
          type: number
          minimum: 0
          example: 25

  responses:
    Unauthorized:
      description: Missing or invalid username or password

    Forbidden:
      description: Only Admin can perform this action
